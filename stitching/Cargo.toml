[package]
name = "stitching"
description = "Stitching shared by the base station and the cloud server: recordings, live previews, restreaming"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
arctos.workspace = true
anyhow.workspace = true
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
nalgebra.workspace = true
png = "0.17"
pollster = "0.4"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
turbojpeg.workspace = true
wgpu = "28"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
